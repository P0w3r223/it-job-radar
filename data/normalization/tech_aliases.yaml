# Third pass over the same report, after 300 more offers widened the vocabulary. The line
# drawn in the first pass held, with one clarification worth writing down: an entry earns
# its place by naming a *thing* — a product, a language, a protocol, a technique that has a
# name — and preferably by unifying spellings this source actually varies. Ways of working
# (agile, itil, prince2, itsm, stakeholder management) stay out for the reason they did
# before. So do bare activity words (api, cloud computing, data modeling, erp, cloud saas):
# they already reach the data under their own name, and giving them a canonical form that
# unifies nothing would move the coverage metric without making any chart truer.

# Data / analytics
"microsoft fabric": [fabric, "ms fabric"]  # bare "fabric" is a judgement: in this market it
                                           # is Microsoft's, not Hyperledger's or Python's
