name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Collection stays local by design (theprotocol serves stripped pages to datacenter IPs),
# so CI never fetches. What it can verify is that the page in `docs/` is exactly what the
# committed dataset produces — which is the failure mode a hand-copied site actually has.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The published dataset names the commits that produced it, and the test that
          # checks those hashes still resolve needs history to resolve them against. At
          # the default depth of 1 it can only skip, which would have let the rewrite
          # orphan fifteen of them exactly as it did.
          #
          # Deleting this line no longer costs a silent skip: `_require_history` fails
          # instead of skipping whenever `CI` is set, so the guard and the checkout depth
          # are coupled by a red test rather than by this comment.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] -c constraints.txt
      - name: Run tests
        run: pytest

  drift:
    name: Published page matches the committed dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pinned: the page's bootstrap intervals come out of numpy's Generator, whose
          # stream is not frozen across releases, so an unpinned resolve would move the
          # rendered SVG and fail this job for a reason no commit caused.
          pip install -e . -c constraints.txt
      - name: Rebuild the page from docs/data
        run: python -m it_job_radar.pipeline site --out build/site
      - name: Fail if docs/index.html is stale or hand-edited
        run: |
          if ! diff -u docs/index.html build/site/index.html; then
            echo "::error file=docs/index.html::The published page does not match the committed dataset. Run 'python -m it_job_radar.pipeline site' and commit the result."
            exit 1
          fi
      - name: Fail if the manifest disagrees with the data beside it
        # The page is rebuilt *from* the manifest, so a stale manifest reproduces itself
        # and passes the diff while reporting figures the parquet does not support.
        run: python -m it_job_radar.pipeline verify

  deploy:
    name: Publish docs/ to GitHub Pages
    needs: [test, drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
