name: CI

on:
  push:
    branches: [main]
  pull_request:

# Collection stays local by design (theprotocol serves stripped pages to datacenter IPs),
# so CI never fetches. What it can verify is that the page in `docs/` is exactly what the
# committed dataset produces — which is the failure mode a hand-copied site actually has.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: pytest

  drift:
    name: Published page matches the committed dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Rebuild the page from docs/data
        run: python -m it_job_radar.pipeline site --out build/site
      - name: Fail if docs/index.html is stale or hand-edited
        run: |
          if ! diff -u --strip-trailing-cr docs/index.html build/site/index.html; then
            echo "::error file=docs/index.html::The published page does not match the committed dataset. Run 'python -m it_job_radar.pipeline site' and commit the result."
            exit 1
          fi

  deploy:
    name: Publish docs/ to GitHub Pages
    needs: [test, drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
